name: Swift CI

on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
  pull_request:
    paths:
      - 'ios-native/**'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-native

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -scheme ChooseGOD -project ChooseGOD.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -scheme ChooseGOD \
            -project ChooseGOD.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-native

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -scheme ChooseGOD -project ChooseGOD.xcodeproj

      - name: Test
        run: |
          xcodebuild test \
            -scheme ChooseGOD \
            -project ChooseGOD.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  swiftlint:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-native

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
