# SwiftLint Configuration for ChooseGOD iOS

excluded:
  - build
  - DerivedData
  - .build
  - Package.swift
  - ChooseGODApp/ChooseGOD.xcodeproj

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - discouraged_optional_boolean
  - empty_string
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - yoda_condition

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

force_cast: warning
force_unwrapping: warning

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - i
