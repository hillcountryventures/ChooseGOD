name: ChooseGOD
options:
  bundleIdPrefix: com.choosegod
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ../Configuration/Debug.xcconfig
  Release: ../Configuration/Release.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: "2.40.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "4.44.2"

targets:
  ChooseGOD:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    resources:
      - path: Resources
    dependencies:
      - package: Supabase
      - package: RevenueCat
      - target: ChooseGODWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ChooseGOD.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ChooseGODWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_STYLE: Automatic

schemes:
  ChooseGOD:
    build:
      targets:
        ChooseGOD: all
    run:
      config: Debug
