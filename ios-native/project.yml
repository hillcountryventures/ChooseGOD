name: ChooseGOD
options:
  bundleIdPrefix: com.choosegod
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "4.43.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  ChooseGOD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChooseGODApp
        excludes:
          - Widgets/**
          - WatchApp/**
          - build/**
          - "**/build/**"
          - "ChooseGOD.xcodeproj/**"
          - "ChooseGOD.xcodeproj.bak/**"
          - "ChooseGOD.xcodeproj.disabled/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app
        INFOPLIST_KEY_NSCameraUsageDescription: "ChooseGOD needs camera access for scanning Bible pages"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ChooseGOD uses speech recognition for voice-guided devotionals"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ChooseGOD needs microphone access for voice features"
        INFOPLIST_KEY_UIBackgroundModes: "audio remote-notification"
        CODE_SIGN_ENTITLEMENTS: ChooseGODApp/ChooseGOD.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
      - package: Sentry
        product: Sentry
    entitlements:
      path: ChooseGODApp/ChooseGOD.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.choosegod.app
        com.apple.security.application-groups:
          - group.com.choosegod.app

  ChooseGODTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChooseGODTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChooseGOD

  ChooseGODWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChooseGODApp/Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app.widgets
        CODE_SIGN_ENTITLEMENTS: ChooseGODApp/Widgets/ChooseGODWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
    entitlements:
      path: ChooseGODApp/Widgets/ChooseGODWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.choosegod.app
    dependencies:
      - target: ChooseGOD
        embed: false

  ChooseGODWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ChooseGODApp/WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choosegod.app.watchapp
        CODE_SIGN_ENTITLEMENTS: ChooseGODApp/WatchApp/ChooseGODWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    entitlements:
      path: ChooseGODApp/WatchApp/ChooseGODWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.choosegod.app
